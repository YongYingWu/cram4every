<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行测题库 · 在线刷题</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1f2430; --muted:#8a91a3;
    --brand:#2f6bff; --brand-soft:#eaf0ff; --good:#16a34a; --good-soft:#e7f7ec;
    --bad:#dc2626; --bad-soft:#fdecec; --line:#e7e9f0; --warn:#d97706;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px}
  img{max-width:100%;height:auto}

  /* ===== top bar ===== */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
          border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar h1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{flex:1}
  .progress-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .progress-bar{width:140px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:var(--brand);width:0%;transition:width .3s}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 16px;border-radius:10px;
       font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{background:#2057d8;color:#fff}
  .btn.ghost{padding:6px 12px;font-size:13px}

  /* ===== home (paper list) ===== */
  .home{max-width:860px;margin:0 auto;padding:40px 20px 120px}
  .home-hero{margin-bottom:20px}
  .home-hero h2{font-size:24px;font-weight:800}
  .home-hero p{color:var(--muted);font-size:14px;margin-top:6px}
  .mode-tabs{display:flex;gap:8px;margin-bottom:24px;background:#eceef5;border-radius:12px;padding:5px;width:fit-content}
  .mode-tab{padding:8px 22px;border-radius:9px;font-size:14px;font-weight:600;color:#5a6376;cursor:pointer;transition:.15s;border:none;background:none;font-family:inherit}
  .mode-tab.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(20,30,60,.12)}

  /* ===== practice mode home ===== */
  .practice-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:14px}
  .practice-panel h3{font-size:17px;margin-bottom:6px}
  .practice-panel .desc{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.7}
  .pstat{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px}
  .pstat .item{background:#f7f8fc;border-radius:10px;padding:12px 18px;min-width:110px}
  .pstat .num{font-size:22px;font-weight:800;color:var(--brand);line-height:1.2}
  .pstat .num.good{color:var(--good)} .pstat .num.bad{color:var(--bad)}
  .pstat .lbl{font-size:12px;color:var(--muted)}
  .pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .pbar-fill{height:100%;background:linear-gradient(90deg,var(--brand),#5f8bff);transition:width .3s}

  /* ===== practice quiz view ===== */
  .pq-wrap{max-width:860px;margin:0 auto;padding:28px 20px 140px}
  .pq-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .pq-count{font-size:15px;font-weight:700}
  .pq-count small{color:var(--muted);font-weight:400}
  .pq-tags{display:flex;gap:8px;font-size:12.5px}
  .pq-tag{padding:3px 10px;border-radius:99px;background:var(--good-soft);color:var(--good);font-weight:700}
  .pq-tag.bad{background:var(--bad-soft);color:var(--bad)}
  .pq-tag.skip{background:#eef1f7;color:var(--muted)}
  .pq-src{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pq-src .chip{background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 8px;font-weight:600}
  .pq-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;
           box-shadow:0 1px 3px rgba(20,30,60,.04)}
  .pq-actions{display:flex;gap:12px;margin-top:20px}
  .pq-actions .btn{flex:1;padding:12px;font-size:15px}
  .btn.good-btn{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
  .btn.good-btn:hover{background:#128c40;color:#fff}
  .btn.big-primary{padding:12px 30px;font-size:15px}
  .pq-result-line{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:15px}
  .pq-result-line.good{background:var(--good-soft);color:var(--good)}
  .pq-result-line.bad{background:var(--bad-soft);color:var(--bad)}
  .pq-analysis{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;animation:fadein .25s}
  .pq-progress-top{height:4px;background:var(--line);position:sticky;top:0;z-index:45}
  .pq-progress-top .f{height:100%;background:linear-gradient(90deg,var(--brand),#5f8bff);transition:width .3s}
  .paper-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
              margin-bottom:14px;cursor:pointer;transition:.15s;display:flex;gap:16px;align-items:center}
  .paper-card:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(47,107,255,.12);transform:translateY(-1px)}
  .paper-icon{flex:none;width:48px;height:48px;border-radius:12px;background:var(--brand-soft);
              display:flex;align-items:center;justify-content:center;font-size:22px}
  .paper-info{flex:1;min-width:0}
  .paper-title{font-weight:700;font-size:16px;line-height:1.5}
  .paper-meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
  .paper-progress{font-size:12px;color:var(--brand);margin-top:6px;font-weight:600}
  .paper-arrow{flex:none;color:var(--muted);font-size:20px}
  .paper-done-tag{font-size:12px;background:var(--good-soft);color:var(--good);border-radius:6px;padding:1px 8px;font-weight:700}
  .paper-ing-tag{font-size:12px;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 8px;font-weight:700}

  /* ===== layout ===== */
  .layout{max-width:1080px;margin:0 auto;padding:24px 20px 120px;display:grid;grid-template-columns:1fr 240px;gap:24px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  .main{min-width:0}

  /* ===== section ===== */
  .section-head{margin:34px 0 14px;padding:12px 18px;background:linear-gradient(135deg,#2f6bff,#5f8bff);
                color:#fff;border-radius:12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .section-head small{font-weight:400;font-size:12px;opacity:.85}

  /* ===== question card ===== */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px;
         box-shadow:0 1px 3px rgba(20,30,60,.04)}
  .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;
        background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:8px;font-size:14px;margin-right:10px}
  .qstatus{font-size:13px;color:var(--muted)}
  .qabstract{background:#fafbfe;border-left:3px solid var(--brand);padding:14px 16px;border-radius:0 10px 10px 0;
             margin:14px 0 6px;font-size:15px;color:#3a4152}
  .qstem{margin:12px 0 4px;font-size:16px}
  .qstem img{display:block;margin:10px auto;max-height:420px}

  /* ===== options ===== */
  .options{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1.5px solid var(--line);
       border-radius:12px;cursor:pointer;transition:.15s;background:#fff;user-select:none}
  .opt:hover{border-color:#b9c8f7;background:#fbfcff}
  .opt .letter{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
               display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#5a6376;transition:.15s}
  .opt .content{flex:1;min-width:0}
  .opt .content img{display:block;margin:4px auto;max-height:300px}
  /* selected (before submit) */
  .opt.selected{border-color:var(--brand);background:var(--brand-soft)}
  .opt.selected .letter{background:var(--brand);border-color:var(--brand);color:#fff}
  /* after submit */
  .opt.correct{border-color:var(--good);background:var(--good-soft)}
  .opt.correct .letter{background:var(--good);border-color:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.disabled{cursor:default}
  .opt-tag{font-size:12px;font-weight:700;margin-left:8px}
  .opt-tag.good{color:var(--good)} .opt-tag.bad{color:var(--bad)}

  /* ===== analysis ===== */
  .analysis{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:none}
  .analysis.show{display:block;animation:fadein .25s}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .verdict{font-weight:700;font-size:15px;margin-bottom:8px}
  .verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
  .ana-body{font-size:14.5px;color:#3a4152;background:#fafbfe;border-radius:10px;padding:14px 16px}
  .ana-body img{display:block;margin:8px auto;max-height:340px}
  .toggle-ana{margin-top:12px;font-size:13px;color:var(--brand);cursor:pointer;background:none;border:none;font-family:inherit}
  .toggle-ana:hover{text-decoration:underline}

  /* ===== sidebar ===== */
  .sidebar{position:sticky;top:76px;align-self:start;background:var(--card);border:1px solid var(--line);
           border-radius:14px;padding:18px;max-height:calc(100vh - 100px);overflow:auto}
  .sidebar h3{font-size:14px;margin-bottom:10px;color:#3a4152}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:7px;
        background:#f2f4f9;color:#5a6376;cursor:pointer;border:1px solid transparent;transition:.12s}
  .cell:hover{border-color:var(--brand)}
  .cell.answered{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .cell.good{background:var(--good-soft);color:var(--good);font-weight:600}
  .cell.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
  .cell.current{outline:2px solid var(--brand);outline-offset:1px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-bottom:12px}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .score-box{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-size:14px;display:none}
  .score-box.show{display:block}
  .score-box .big{font-size:26px;font-weight:800;color:var(--brand)}
  .stat-row{display:flex;justify-content:space-between;margin:4px 0;color:#4a5266}
  .sidebar .btn{width:100%;margin-top:10px}
  @media (max-width:900px){
    .sidebar{position:fixed;right:0;top:0;height:100vh;width:260px;z-index:60;border-radius:0;
             transform:translateX(100%);transition:transform .25s;max-height:none}
    .sidebar.open{transform:none}
    .fab{position:fixed;bottom:20px;right:20px;z-index:55;width:52px;height:52px;border-radius:50%;
         background:var(--brand);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(47,107,255,.4);display:flex;align-items:center;justify-content:center}
  }
  @media (min-width:901px){.fab{display:none}}
  .qtable{border-collapse:collapse;margin:10px 0;font-size:14px}
  .qtable td{border:1px solid #d5dae6;padding:5px 10px}

  /* ===== submit bar ===== */
  .submit-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
              border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:center;gap:14px;z-index:40}
  .submit-bar .inner{max-width:1080px;width:100%;display:flex;align-items:center;gap:14px}
  .submit-bar .info{font-size:13px;color:var(--muted)}

  /* ===== result modal ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(15,20,35,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:30px;max-width:440px;width:100%;text-align:center;animation:pop .25s}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .score-big{font-size:52px;font-weight:800;color:var(--brand);line-height:1.1}
  .modal .sub{color:var(--muted);font-size:14px;margin:8px 0 18px}
  .modal .rows{text-align:left;font-size:14px;margin-bottom:20px}
  .modal .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
  .modal .row:last-child{border:none}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-inner">
    <button class="btn ghost" id="backBtn" style="flex:none">‹ 试卷列表</button>
    <h1 id="paperTitle"></h1>
    <div class="spacer"></div>
    <div class="progress-wrap">
      <span id="progressText">已答 0/0</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="btn" id="resetBtn">重新作答</button>
    <button class="btn primary" id="submitBtn">交卷判分</button>
  </div>
</div>

<!-- ===== 首页 ===== -->
<div class="home" id="home">
  <div class="home-hero">
    <h2>在线刷题</h2>
    <p id="homeDesc">选择一套试卷开始作答，点击选项即可选择答案，交卷后自动判分并展示解析</p>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabMock">📝 模拟考</button>
    <button class="mode-tab" id="tabPractice">⚡ 刷题模式</button>
  </div>
  <div id="paperList"></div>
  <div id="practiceHome" style="display:none"></div>
</div>

<!-- ===== 刷题模式做题页 ===== -->
<div class="pq-wrap" id="practiceView" style="display:none">
  <div class="pq-progress-top"><div class="f" id="pqTopFill"></div></div>
  <div style="margin-bottom:14px">
    <button class="btn ghost" id="pqBackBtn">‹ 返回</button>
  </div>
  <div class="pq-top">
    <span class="pq-count" id="pqCount"></span>
    <div style="flex:1"></div>
    <div class="pq-tags">
      <span class="pq-tag" id="pqGood">✓ 0</span>
      <span class="pq-tag bad" id="pqBad">✗ 0</span>
      <span class="pq-tag skip" id="pqSkip">⊘ 0</span>
    </div>
  </div>
  <div id="pqBody"></div>
</div>

<div class="layout" id="layout" style="display:none">
  <div class="main" id="main"></div>
  <aside class="sidebar" id="sidebar">
    <h3>答题卡</h3>
    <div class="legend">
      <span><i class="dot" style="background:#f2f4f9"></i>未答</span>
      <span><i class="dot" style="background:var(--brand-soft)"></i>已答</span>
      <span><i class="dot" style="background:var(--good-soft)"></i>正确</span>
      <span><i class="dot" style="background:var(--bad-soft)"></i>错误</span>
    </div>
    <div id="gridWrap"></div>
    <div class="score-box" id="scoreBox">
      <div>得分（每题1分）</div>
      <div class="big"><span id="scoreNum">0</span><span style="font-size:16px;color:var(--muted)"> / 120</span></div>
      <div class="stat-row"><span>正确</span><span id="goodCount" style="color:var(--good);font-weight:700">0</span></div>
      <div class="stat-row"><span>错误</span><span id="badCount" style="color:var(--bad);font-weight:700">0</span></div>
      <div class="stat-row"><span>未答</span><span id="noneCount">0</span></div>
    </div>
    <button class="btn primary" id="submitBtn2">交卷判分</button>
  </aside>
</div>

<button class="fab" id="fab" style="display:none">☰</button>

<div class="submit-bar" id="submitBar" style="display:none">
  <div class="inner">
    <span class="info" id="bottomInfo">点击选项即可作答，答完可交卷判分</span>
    <div style="flex:1"></div>
    <button class="btn primary" id="submitBtn3">交卷判分</button>
  </div>
</div>

<div class="modal-mask" id="confirmMask">
  <div class="modal">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px" id="confirmTitle">提示</div>
    <div class="sub" id="confirmText"></div>
    <div style="display:flex;gap:10px">
      <button class="btn" style="flex:1" onclick="document.getElementById('confirmMask').classList.remove('show')">取消</button>
      <button class="btn primary" style="flex:1" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div style="font-size:15px;color:var(--muted)">本次得分</div>
    <div class="score-big" id="modalScore">0</div>
    <div class="sub">满分 120 分 · 每题 1 分</div>
    <div class="rows" id="modalRows"></div>
    <button class="btn primary" style="width:100%" onclick="document.getElementById('modalMask').classList.remove('show')">查看答题情况</button>
  </div>
</div>

<script>
let REGISTRY = [];       // from assets/index.json
let PAPER = null;        // current paper meta
let QUESTIONS = [];
let answers = {};        // num -> letter
let submitted = false;

const $ = id => document.getElementById(id);

/* ================= 首页：加载试卷注册表 ================= */
fetch('assets/index.json').then(r=>r.json()).then(list=>{
  REGISTRY = list;
  renderHome();
});

function storageKey(pid){ return 'quiz_' + pid; }
function loadSaved(pid){
  try{
    const s = JSON.parse(localStorage.getItem(storageKey(pid))||'null');
    return (s && s.answers) ? s : null;
  }catch(e){ return null; }
}

function renderHome(){
  const wrap = $('paperList');
  wrap.innerHTML = '';
  REGISTRY.forEach(p=>{
    const saved = loadSaved(p.id);
    const total = p.total || '?';
    let statusHtml = '';
    if(saved){
      const done = Object.keys(saved.answers).length;
      if(saved.submitted){
        statusHtml = `<div class="paper-progress"><span class="paper-done-tag">已完成 · 得分 ${saved.score}</span></div>`;
      } else if(done > 0){
        statusHtml = `<div class="paper-progress"><span class="paper-ing-tag">进行中 · 已答 ${done}/${total}</span></div>`;
      }
    }
    const card = document.createElement('div');
    card.className = 'paper-card';
    card.innerHTML = `
      <div class="paper-icon">📄</div>
      <div class="paper-info">
        <div class="paper-title">${p.title}</div>
        <div class="paper-meta">
          ${p.subtitle ? `<span>${p.subtitle}</span>` : ''}
          <span>共 ${total} 题</span>
          ${p.updatedAt ? `<span>更新于 ${p.updatedAt}</span>` : ''}
        </div>
        ${statusHtml}
      </div>
      <div class="paper-arrow">›</div>`;
    card.onclick = ()=>openPaper(p);
    wrap.appendChild(card);
  });
}

/* ================= 打开试卷 ================= */
function openPaper(p){
  PAPER = p;
  fetch(p.file).then(r=>r.json()).then(data=>{
    QUESTIONS = data;
    answers = {};
    submitted = false;
    const saved = loadSaved(p.id);
    if(saved){
      answers = saved.answers || {};
      // restore submitted state
      if(saved.submitted){
        renderQuiz();
        doSubmit(true);
        showQuizView();
        return;
      }
    }
    renderQuiz();
    showQuizView();
  });
}

function showQuizView(){
  $('home').style.display = 'none';
  $('topbar').style.display = '';
  $('layout').style.display = '';
  $('submitBar').style.display = '';
  $('fab').style.display = '';
  $('paperTitle').textContent = PAPER.title;
  document.title = PAPER.title + ' · 在线刷题';
  window.scrollTo(0,0);
}

function showHome(){
  $('home').style.display = '';
  $('practiceView').style.display = 'none';
  $('topbar').style.display = 'none';
  $('layout').style.display = 'none';
  $('submitBar').style.display = 'none';
  $('fab').style.display = 'none';
  $('sidebar').classList.remove('open');
  document.title = '行测题库 · 在线刷题';
  renderHome();  // refresh progress badges
  window.scrollTo(0,0);
}

function persist(){
  localStorage.setItem(storageKey(PAPER.id), JSON.stringify({
    answers, submitted,
    score: submitted ? QUESTIONS.filter(q=>answers[q.num]===q.answer).length : undefined
  }));
}

/* ================= 渲染试卷 ================= */
function renderQuiz(){
  submitted = false;
  const total = QUESTIONS.length;
  const main = $('main');
  const gridWrap = $('gridWrap');
  main.innerHTML = '';
  gridWrap.innerHTML = '';
  $('scoreBox').classList.remove('show');
  $('bottomInfo').textContent = '点击选项即可作答，答完可交卷判分';
  document.querySelectorAll('#submitBtn,#submitBtn2,#submitBtn3').forEach(b=>{
    b.textContent = '交卷判分'; b.disabled = false; b.style.opacity = 1; b.style.cursor = 'pointer';
  });
  let curSection = '';
  let grid = null;

  QUESTIONS.forEach((q)=>{
    if(q.section !== curSection){
      curSection = q.section;
      const head = document.createElement('div');
      head.className = 'section-head';
      const inSec = QUESTIONS.filter(x=>x.section===q.section);
      head.innerHTML = `<span>${q.section}</span><small>${inSec[0].num} ~ ${inSec[inSec.length-1].num} 题 · 共 ${inSec.length} 题</small>`;
      main.appendChild(head);
      const lab = document.createElement('div');
      lab.style.cssText = 'font-size:12px;color:var(--muted);margin:8px 0 6px';
      lab.textContent = q.section.replace(/^第.部分\s*/,'');
      gridWrap.appendChild(lab);
      grid = document.createElement('div');
      grid.className = 'grid';
      gridWrap.appendChild(grid);
    }

    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.num;

    let optsHtml = q.options.map((o, i)=>{
      const letter = String.fromCharCode(65+i);
      return `<div class="opt" data-q="${q.num}" data-l="${letter}" id="q${q.num}-opt${letter}">
        <span class="letter">${letter}</span>
        <span class="content">${o}<span class="opt-tag" id="q${q.num}-tag${letter}"></span></span>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div><span class="qnum">${q.num}</span><span class="qstatus" id="q${q.num}-status"></span></div>
      ${q.abstract ? `<div class="qabstract">${q.abstract}</div>` : ''}
      <div class="qstem">${q.stem}</div>
      <div class="options">${optsHtml}</div>
      <div class="analysis" id="q${q.num}-ana">
        <div class="verdict" id="q${q.num}-verdict"></div>
        <div class="ana-body"><b style="color:var(--brand)">正确答案：${q.answer}</b><br><br>${q.analysis}</div>
      </div>`;
    main.appendChild(card);

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell'+q.num;
    cell.textContent = q.num;
    cell.onclick = ()=>{
      $('q'+q.num).scrollIntoView({behavior:'smooth', block:'center'});
      document.querySelectorAll('.cell.current').forEach(c=>c.classList.remove('current'));
      cell.classList.add('current');
      if(window.innerWidth<=900) $('sidebar').classList.remove('open');
    };
    grid.appendChild(cell);
  });

  document.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(submitted) return;
      const qn = +el.dataset.q, letter = el.dataset.l;
      answers[qn] = letter;
      persist();
      document.querySelectorAll(`.opt[data-q="${qn}"]`).forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
      $('cell'+qn).classList.add('answered');
      $('cell'+qn).classList.remove('good','bad');
      $('q'+qn+'-status').textContent = '已选 ' + letter;
      updateProgress();
    });
  });

  // restore selections
  Object.entries(answers).forEach(([qn, letter])=>{
    const el = $(`q${qn}-opt${letter}`);
    if(el) el.classList.add('selected');
    const cell = $('cell'+qn);
    if(cell) cell.classList.add('answered');
    const st = $('q'+qn+'-status');
    if(st) st.textContent = '已选 ' + letter;
  });
  updateProgress();
}

function updateProgress(){
  const total = QUESTIONS.length;
  const done = Object.keys(answers).length;
  $('progressText').textContent = `已答 ${done}/${total}`;
  $('progressFill').style.width = (done/total*100)+'%';
}

/* ================= 弹窗 ================= */
function showConfirm(title, text, onOk){
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  const mask = $('confirmMask');
  mask.classList.add('show');
  $('confirmOk').onclick = ()=>{
    mask.classList.remove('show');
    onOk();
  };
}

/* ================= 交卷判分 ================= */
function submit(){
  if(submitted) return;
  const total = QUESTIONS.length;
  const done = Object.keys(answers).length;
  if(done < total){
    showConfirm('交卷判分', `还有 ${total-done} 题未作答，确定交卷吗？未作答按错误处理。`, ()=>doSubmit(false));
    return;
  }
  doSubmit(false);
}

function doSubmit(isRestore){
  if(submitted && !isRestore) return;
  submitted = true;
  persist();

  let good = 0, bad = 0, none = 0;
  QUESTIONS.forEach(q=>{
    const ua = answers[q.num];
    const anaEl = $('q'+q.num+'-ana');
    const verdict = $('q'+q.num+'-verdict');
    const cell = $('cell'+q.num);

    q.options.forEach((o,i)=>{
      const letter = String.fromCharCode(65+i);
      const el = $(`q${q.num}-opt${letter}`);
      const tag = $(`q${q.num}-tag${letter}`);
      el.classList.add('disabled');
      el.classList.remove('selected');
      if(letter === q.answer){
        el.classList.add('correct');
        tag.className = 'opt-tag good';
        tag.textContent = ' ✓ 正确答案';
      } else if(ua === letter){
        el.classList.add('wrong');
        tag.className = 'opt-tag bad';
        tag.textContent = ' ✗ 你的选择';
      }
    });

    if(!ua){
      none++;
      verdict.className = 'verdict bad';
      verdict.textContent = '未作答';
      cell.classList.remove('answered','good','bad');
    } else if(ua === q.answer){
      good++;
      verdict.className = 'verdict good';
      verdict.textContent = '回答正确';
      cell.classList.remove('answered','bad'); cell.classList.add('good');
    } else {
      bad++;
      verdict.className = 'verdict bad';
      verdict.textContent = `回答错误（你选 ${ua}）`;
      cell.classList.remove('answered','good'); cell.classList.add('bad');
    }
    anaEl.classList.add('show');
  });

  const spq = PAPER.scorePerQuestion || 1;
  const total = QUESTIONS.length;
  $('scoreBox').classList.add('show');
  $('scoreNum').textContent = good * spq;
  document.querySelector('#scoreBox .big span[style]').textContent = ` / ${total * spq}`;
  $('goodCount').textContent = good;
  $('badCount').textContent = bad;
  $('noneCount').textContent = none;
  $('bottomInfo').textContent = `已交卷：对 ${good} 题，错 ${bad} 题，未答 ${none} 题`;

  if(!isRestore){
    $('modalScore').textContent = good * spq;
    document.querySelector('#modalMask .sub').textContent = `满分 ${total * spq} 分 · 每题 ${spq} 分`;
    const secs = [...new Set(QUESTIONS.map(q=>q.section))];
    $('modalRows').innerHTML = secs.map(s=>{
      const inSec = QUESTIONS.filter(q=>q.section===s);
      const g = inSec.filter(q=>answers[q.num]===q.answer).length;
      return `<div class="row"><span>${s}</span><span>${g} / ${inSec.length}</span></div>`;
    }).join('');
    $('modalMask').classList.add('show');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  document.querySelectorAll('#submitBtn,#submitBtn2,#submitBtn3').forEach(b=>{
    b.textContent = '已交卷'; b.disabled = true; b.style.opacity = .6; b.style.cursor = 'default';
  });
}

/* ================= 重新作答 ================= */
function reset(){
  showConfirm('重新作答', '确定清空本套试卷的作答记录并重新开始吗？', doReset);
}
function doReset(){
  answers = {}; submitted = false;
  localStorage.removeItem(storageKey(PAPER.id));
  renderQuiz();
}

$('submitBtn').onclick = submit;
$('submitBtn2').onclick = submit;
$('submitBtn3').onclick = submit;
$('resetBtn').onclick = reset;
$('backBtn').onclick = showHome;
$('fab').onclick = ()=>$('sidebar').classList.toggle('open');
$('modalMask').addEventListener('click', e=>{
  if(e.target.id==='modalMask') e.target.classList.remove('show');
});

/* ================= 刷题模式 ================= */
let POOL = [];           // 全部题目（跨试卷）
let PQ = null;           // 当前刷题会话 {order, idx, answers:{key:{pick,correct}}, locked}
const PQ_KEY = 'practice_pool_v1';

function practiceStorage(){ return PQ_KEY; }
function loadPractice(){
  try{ return JSON.parse(localStorage.getItem(practiceStorage())||'null'); }catch(e){ return null; }
}
function savePractice(){
  if(!PQ) return;
  localStorage.setItem(practiceStorage(), JSON.stringify({
    order: PQ.order, idx: PQ.idx, answers: PQ.answers, done: PQ.done
  }));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

async function buildPool(){
  if(POOL.length) return POOL;
  const all = [];
  await Promise.all(REGISTRY.map(async p=>{
    const qs = await fetch(p.file).then(r=>r.json());
    qs.forEach(q=>all.push({...q, paperTitle: p.title, paperId: p.id}));
  }));
  POOL = all;
  return POOL;
}

/* ---------- 刷题首页 ---------- */
async function renderPracticeHome(){
  const el = $('practiceHome');
  el.innerHTML = '<div class="practice-panel"><h3>题库加载中…</h3></div>';
  const pool = await buildPool();
  const saved = loadPractice();
  const total = pool.length;

  let statHtml = '';
  if(saved && saved.order && saved.order.length === total){
    const ansCount = Object.keys(saved.answers||{}).length;
    const good = Object.values(saved.answers||{}).filter(a=>a.correct).length;
    const bad = ansCount - good;
    const pct = Math.round(saved.idx/total*100);
    if(saved.done){
      statHtml = `
        <div class="pstat">
          <div class="item"><div class="num">${total}</div><div class="lbl">已全部刷完 🎉</div></div>
          <div class="item"><div class="num good">${good}</div><div class="lbl">答对</div></div>
          <div class="item"><div class="num bad">${bad}</div><div class="lbl">答错</div></div>
          <div class="item"><div class="num">${Math.round(good/total*100)}%</div><div class="lbl">正确率</div></div>
        </div>
        <button class="btn primary big-primary" onclick="startPractice(true)">重新开始一轮</button>`;
    } else {
      statHtml = `
        <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
        <div class="pstat">
          <div class="item"><div class="num">${saved.idx}<span style="font-size:14px;color:var(--muted)">/${total}</span></div><div class="lbl">当前进度</div></div>
          <div class="item"><div class="num good">${good}</div><div class="lbl">答对</div></div>
          <div class="item"><div class="num bad">${bad}</div><div class="lbl">答错</div></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn primary big-primary" onclick="startPractice(false)">继续刷题（第 ${saved.idx+1} 题）</button>
          <button class="btn big-primary" onclick="startPractice(true)">重新开始</button>
        </div>`;
    }
  } else {
    statHtml = `<button class="btn primary big-primary" onclick="startPractice(true)">开始刷题</button>`;
  }

  el.innerHTML = `
    <div class="practice-panel">
      <h3>⚡ 随机刷题</h3>
      <div class="desc">汇集全部 ${REGISTRY.length} 套试卷共 <b>${total}</b> 道题，随机顺序出题、不重复。<br>
      每题作答后立即显示对错与解析，点击"下一题"继续。进度自动保存，可随时中断继续。</div>
      ${statHtml}
    </div>`;
}

/* ---------- 开始/继续刷题 ---------- */
async function startPractice(fresh){
  const pool = await buildPool();
  const saved = loadPractice();
  if(!fresh && saved && saved.order && saved.order.length === pool.length && !saved.done){
    PQ = { order: saved.order, idx: saved.idx, answers: saved.answers||{}, done:false, locked:false };
  } else {
    PQ = { order: shuffle(pool.map((_,i)=>i)), idx: 0, answers: {}, done:false, locked:false };
  }
  savePractice();
  showPracticeView();
  renderPQ();
}
window.startPractice = startPractice;

function showPracticeView(){
  $('home').style.display = 'none';
  $('practiceView').style.display = '';
  $('topbar').style.display = 'none';
  $('layout').style.display = 'none';
  $('submitBar').style.display = 'none';
  $('fab').style.display = 'none';
  document.title = '刷题模式 · 在线刷题';
  window.scrollTo(0,0);
}

/* ---------- 渲染当前题 ---------- */
function renderPQ(){
  const total = PQ.order.length;
  if(PQ.idx >= total){
    renderPQDone();
    return;
  }
  const q = POOL[PQ.order[PQ.idx]];
  const key = q.paperId + '#' + q.num;
  const answered = PQ.answers[key];
  PQ.locked = !!answered;

  $('pqCount').innerHTML = `第 ${PQ.idx+1} 题 <small>/ 共 ${total} 题</small>`;
  $('pqTopFill').style.width = (PQ.idx/total*100)+'%';

  const good = Object.values(PQ.answers).filter(a=>a.correct).length;
  const bad = Object.values(PQ.answers).filter(a=>!a.correct && a.pick).length;
  const skip = Object.values(PQ.answers).filter(a=>!a.pick).length;
  $('pqGood').textContent = '✓ ' + good;
  $('pqBad').textContent = '✗ ' + bad;
  $('pqSkip').textContent = '⊘ ' + skip;

  let optsHtml = q.options.map((o,i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = 'opt pq-opt';
    let tag = '';
    if(answered){
      cls += ' disabled';
      if(letter === q.answer){ cls += ' correct'; tag = '<span class="opt-tag good"> ✓ 正确答案</span>'; }
      else if(answered.pick === letter){ cls += ' wrong'; tag = '<span class="opt-tag bad"> ✗ 你的选择</span>'; }
    }
    return `<div class="${cls}" data-l="${letter}">
      <span class="letter">${letter}</span>
      <span class="content">${o}${tag}</span>
    </div>`;
  }).join('');

  let resultHtml = '';
  if(answered && answered.pick){
    resultHtml = answered.correct
      ? `<div class="pq-result-line good">✓ 回答正确</div>`
      : `<div class="pq-result-line bad">✗ 回答错误，正确答案是 ${q.answer}</div>`;
  } else if(answered && !answered.pick){
    resultHtml = `<div class="pq-result-line bad">⊘ 已跳过，正确答案是 ${q.answer}</div>`;
  }

  $('pqBody').innerHTML = `
    <div class="pq-card">
      <div class="pq-src"><span class="chip">第 ${q.num} 题 · ${q.section}</span><span>${q.paperTitle}</span></div>
      ${q.abstract ? `<div class="qabstract">${q.abstract}</div>` : ''}
      <div class="qstem">${q.stem}</div>
      <div class="options" id="pqOpts">${optsHtml}</div>
      ${resultHtml}
      ${answered ? `<div class="pq-analysis"><div class="ana-body"><b style="color:var(--brand)">正确答案：${q.answer}</b><br><br>${q.analysis}</div></div>` : ''}
      <div class="pq-actions">
        ${!answered ? `<button class="btn" id="pqSkipBtn">不会，看答案</button>` : ''}
        ${answered ? `<button class="btn good-btn" id="pqNextBtn">${PQ.idx+1 >= total ? '完成 ✓' : '下一题 →'}</button>` : ''}
      </div>
    </div>`;

  if(!answered){
    document.querySelectorAll('.pq-opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(PQ.locked) return;
        PQ.locked = true;
        const letter = el.dataset.l;
        PQ.answers[key] = { pick: letter, correct: letter === q.answer };
        savePractice();
        renderPQ();
      });
    });
    $('pqSkipBtn').onclick = ()=>{
      PQ.locked = true;
      PQ.answers[key] = { pick: null, correct: false };
      savePractice();
      renderPQ();
    };
  } else {
    $('pqNextBtn').onclick = ()=>{
      PQ.idx++;
      if(PQ.idx >= total){ PQ.done = true; }
      savePractice();
      if(PQ.done){ renderPQDone(); } else { renderPQ(); window.scrollTo({top:0}); }
    };
  }
}

/* ---------- 刷完总结 ---------- */
function renderPQDone(){
  const total = PQ.order.length;
  const good = Object.values(PQ.answers).filter(a=>a.correct).length;
  const bad = Object.values(PQ.answers).filter(a=>!a.correct && a.pick).length;
  const skip = Object.values(PQ.answers).filter(a=>!a.pick).length;
  $('pqCount').innerHTML = '本轮刷题完成 🎉';
  $('pqTopFill').style.width = '100%';
  $('pqGood').textContent = '✓ ' + good;
  $('pqBad').textContent = '✗ ' + bad;
  $('pqSkip').textContent = '⊘ ' + skip;
  $('pqBody').innerHTML = `
    <div class="practice-panel" style="text-align:center;padding:40px 26px">
      <div style="font-size:48px;margin-bottom:8px">🏁</div>
      <h3 style="margin-bottom:14px">${total} 道题全部刷完！</h3>
      <div class="pstat" style="justify-content:center">
        <div class="item"><div class="num good">${good}</div><div class="lbl">答对</div></div>
        <div class="item"><div class="num bad">${bad}</div><div class="lbl">答错</div></div>
        <div class="item"><div class="num">${skip}</div><div class="lbl">跳过</div></div>
        <div class="item"><div class="num">${Math.round(good/total*100)}%</div><div class="lbl">正确率</div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary big-primary" onclick="startPractice(true)">再来一轮</button>
        <button class="btn big-primary" onclick="pqGoHome()">返回首页</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

function pqGoHome(){
  $('practiceView').style.display = 'none';
  showHome();
  switchTab('practice');
}
window.pqGoHome = pqGoHome;

$('pqBackBtn').onclick = pqGoHome;

/* ---------- 首页 Tab 切换 ---------- */
function switchTab(which){
  const isMock = which === 'mock';
  $('tabMock').classList.toggle('active', isMock);
  $('tabPractice').classList.toggle('active', !isMock);
  $('paperList').style.display = isMock ? '' : 'none';
  $('practiceHome').style.display = isMock ? 'none' : '';
  $('homeDesc').textContent = isMock
    ? '选择一套试卷开始作答，点击选项即可选择答案，交卷后自动判分并展示解析'
    : '所有试卷题目混合随机出题，答一题看一题解析';
  if(!isMock) renderPracticeHome();
}
window.switchTab = switchTab;
$('tabMock').onclick = ()=>switchTab('mock');
$('tabPractice').onclick = ()=>switchTab('practice');
</script>
